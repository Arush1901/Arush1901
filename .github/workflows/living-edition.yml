name: Refresh the living landscape

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/living_edition.py
      - tests/test_living_edition.py
      - .github/workflows/living-edition.yml

permissions:
  contents: write

concurrency:
  group: living-edition
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check calendar handling
        run: python3 -m unittest discover -s tests -v
      - name: Draw from current public contributions
        run: python3 scripts/living_edition.py --refresh
      - name: Save the updated artwork
        run: |
          git add assets/living-edition*.svg data/contributions.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh contribution landscape'
          git push origin HEAD:main
