<svg xmlns="http://www.w3.org/2000/svg" width="720" height="173" viewBox="0 0 720 173" role="img" aria-labelledby="title desc">
<title id="title">Arush Maurya</title><desc id="desc">Folio: Arush Maurya, software developer and computer science student.</desc>
<style>
.ink-motion { animation: ink-journey 16s ease-in-out infinite; }
@keyframes ink-journey {
  0%, 12% { transform: translateX(360px); opacity: .85; }
  40% { transform: translateX(625px); opacity: .55; }
  72% { transform: translateX(95px); opacity: .55; }
  100% { transform: translateX(360px); opacity: .85; }
}
@media (prefers-reduced-motion: reduce) {
  .ink-motion { animation: none; transform: translateX(360px); opacity: .85; }
}
</style>
<text x="245" y="113" fill="#e9edf2" font-family="Georgia, 'Times New Roman', serif" font-size="110" letter-spacing="-6" text-anchor="middle">arush</text>
<text x="425" y="109" fill="#eab39c" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-style="italic" letter-spacing="-2">/ maurya</text>
<line x1="62" y1="153" x2="658" y2="153" stroke="#30363d"/>
<g class="ink-motion" transform="translate(360 0)">
  <line x1="-19" y1="153" x2="19" y2="153" stroke="#eab39c" stroke-width="1.3" stroke-linecap="round" opacity=".5"/>
  <circle cx="0" cy="153" r="3" fill="#eab39c"/>
</g>
</svg>
